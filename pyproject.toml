[project]
name = "judgegate"
version = "0.1.0"
description = "JudgeGate: can an LLM judge replace the human audits that grant an AI agent autonomy? Evaluated on real human-booked council card data, local models only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
judgegate = "judgegate.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["judgegate"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
